{% extends "base.html" %}

{% block title %}Nouvel Étudiant - UIR Présence{% endblock %}

{% block body %}
<div class="flex min-h-screen">
    <!-- Sidebar -->
    {% include "teacher/sidebar.html" %}

    <main class="flex-1 ml-64 p-8">
        <div class="mb-8">
            <a href="{{ url_for('teacher.track_students') }}" class="text-primary hover:underline mb-2 inline-block">
                <i class="fas fa-arrow-left mr-2"></i>Retour
            </a>
            <h1 class="text-3xl font-bold text-primary">Nouvel Étudiant</h1>
        </div>

        <div class="card p-8 max-w-2xl">
            <div class="mb-6 p-4 bg-blue-50 rounded-lg">
                <p class="text-blue-700 text-sm">
                    <i class="fas fa-info-circle mr-2"></i>
                    Un email sera envoyé à l'étudiant pour créer son mot de passe.
                </p>
            </div>

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
                <div class="space-y-6">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Prénom *</label>
                            <input type="text" name="first_name" required class="input-field"
                                value="{{ student.first_name if student else '' }}">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Nom *</label>
                            <input type="text" name="last_name" required class="input-field"
                                value="{{ student.last_name if student else '' }}">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email institutionnel *</label>
                        <input type="email" name="email" required class="input-field" placeholder="prenom.nom@uir.ac.ma"
                            value="{{ student.email if student else '' }}">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Année Académique *</label>
                            <select name="academic_year_id" required class="input-field">
                                {% for year in academic_years %}
                                <option value="{{ year.id }}" {% if (student and student.current_year_id==year.id) or
                                    (not student and loop.first) %}selected{% endif %}>
                                    {{ year.name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Matricule *</label>
                            <input type="text" name="matricule" required class="input-field" placeholder="Ex: ETU001"
                                value="{{ student.matricule if student and student.matricule else '' }}">
                        </div>
                    </div>

                    <div class="flex justify-end space-x-4">
                        <a href="{{ url_for('teacher.track_students') }}" class="btn-secondary">Annuler</a>
                        <button type="submit" class="btn-primary">
                            <i class="fas fa-save mr-2"></i>Créer
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </main>
</div>
{% endblock %}
